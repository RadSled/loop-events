<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My React App</title>
  </head>

  <body>
    <div id="root"></div>
    <script>
      const backendFromQuery = new URLSearchParams(window.location.search).get("backend")
      if (backendFromQuery) {
        window.__LOOP_EVENTS_BACKEND__ = backendFromQuery
      }
      if (!window.__LOOP_EVENTS_BACKEND__) {
        const host = String(window.location.hostname || "")
        const isLocalHost = /^(localhost|127\.0\.0\.1)$/i.test(host)
        window.__LOOP_EVENTS_BACKEND__ = isLocalHost ? "http://localhost:3001" : "https://loop-events.onrender.com"
      }
      window.__SUPABASE_URL__ = "https://rgbaagmzszzouhhixpbl.supabase.co";
      window.__SUPABASE_ANON_KEY__ = "sb_publishable_UROiNGg8lrbDDAllVz8ggg_UsQ_jFa_";

      const hash = new URLSearchParams(String(window.location.hash || "").replace(/^#/, ""))
      const isOAuthPopup = Boolean(window.opener && window.opener !== window && window.name === "loop-events-oauth")
      const accessToken = String(hash.get("access_token") || "").trim()
      const refreshToken = String(hash.get("refresh_token") || "").trim()
      const authError = String(hash.get("error_description") || hash.get("error") || "").trim()

      if (isOAuthPopup && (authError || (accessToken && refreshToken))) {
        const root = document.getElementById("root")
        if (root) {
          root.innerHTML = `
            <div style="min-height:100vh;display:grid;place-items:center;background:#eef2f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0f172a;">
              <div style="width:min(460px,calc(100vw - 24px));border-radius:14px;border:1px solid #dfe7f3;background:#fff;box-shadow:0 16px 30px rgba(15,23,42,0.12);padding:14px;">
                <div style="font-size:16px;font-weight:700;">${authError ? "Could not complete authentication" : "Login successful"}</div>
                <div style="margin-top:8px;font-size:13px;color:#475569;">${authError ? authError : "You can close this tab and go back to Webflow."}</div>
                <button type="button" onclick="window.close()" style="margin-top:12px;height:34px;border-radius:10px;border:1px solid #d7dfef;background:#fff;color:#1f2937;font-weight:600;cursor:pointer;padding:0 12px;">Close tab</button>
              </div>
            </div>
          `
        }

        if (!authError) {
          try {
            window.opener.postMessage(
              {
                type: "loop-events-auth-session",
                access_token: accessToken,
                refresh_token: refreshToken,
              },
              "*"
            )
            window.opener.postMessage({ type: "loop-events-auth-complete" }, "*")
          } catch {
            // ignore cross-window messaging errors
          }
          window.setTimeout(() => {
            try { window.close() } catch {}
          }, 900)
        }
      } else {
        const appScript = document.createElement("script")
        appScript.src = "./bundle.js"
        document.body.appendChild(appScript)
      }
    </script>
  </body>
</html>
